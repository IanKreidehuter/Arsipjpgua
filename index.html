<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Glass Player</title>

<style>
:root{
  --bg:#11111a;
  --glass:rgba(255,255,255,.09);
  --glass-strong:rgba(255,255,255,.14);
  --border:rgba(255,255,255,.14);
  --text:#fff;
  --muted:rgba(255,255,255,.58);
  --accent:#a98cff;
  --accent2:#d8cfff;
  --danger:#ff718c;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color:var(--text);

  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(125,90,255,.35),
      transparent 35%
    ),
    radial-gradient(
      circle at 85% 80%,
      rgba(255,90,180,.18),
      transparent 35%
    ),
    linear-gradient(
      135deg,
      #151522,
      #0c0c12
    );

  min-height:100vh;
  overflow-x:hidden;
}

button,
input{
  font:inherit;
}

button{
  color:inherit;
  border:0;
  background:none;
  cursor:pointer;
}

button:active{
  transform:scale(.96);
}

.app{
  width:100%;
  max-width:900px;
  min-height:100vh;
  margin:auto;
  padding:
    max(20px,env(safe-area-inset-top))
    20px
    max(30px,env(safe-area-inset-bottom));
}

/* ---------------- HEADER ---------------- */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:22px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo-icon{
  width:44px;
  height:44px;
  border-radius:14px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:var(--glass-strong);
  border:1px solid var(--border);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  font-size:20px;
}

.logo-text{
  font-size:18px;
  font-weight:700;
  letter-spacing:-.03em;
}

.repo-name{
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
}

.refresh{
  width:42px;
  height:42px;
  border-radius:13px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:var(--glass);
  border:1px solid var(--border);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  font-size:18px;
}

.refresh.loading{
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* ---------------- SEARCH ---------------- */

.search{
  display:flex;
  align-items:center;
  gap:10px;

  padding:13px 16px;

  border-radius:18px;

  background:var(--glass);
  border:1px solid var(--border);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  margin-bottom:18px;
}

.search-icon{
  opacity:.55;
  font-size:17px;
}

.search input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
}

.search input::placeholder{
  color:rgba(255,255,255,.45);
}

/* ---------------- PLAYER ---------------- */

.player{
  padding:20px;
  border-radius:28px;

  background:var(--glass);
  border:1px solid var(--border);

  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);

  box-shadow:
    0 25px 70px rgba(0,0,0,.25);

  margin-bottom:20px;
}

.visual{
  width:100%;
  aspect-ratio:1/1;

  border-radius:22px;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 40% 35%,
      rgba(255,255,255,.3),
      transparent 20%
    ),
    linear-gradient(
      135deg,
      #5b4c9e,
      #241d42
    );

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;
}

.visual::after{
  content:"";

  position:absolute;
  inset:0;

  background:
    radial-gradient(
      circle at center,
      transparent 20%,
      rgba(0,0,0,.2)
    );
}

.visual-icon{
  position:relative;
  z-index:2;

  font-size:70px;
  opacity:.9;
}

.visual video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
}

.track-info{
  margin-top:18px;
}

.track-title{
  font-size:23px;
  font-weight:700;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.track-artist{
  margin-top:5px;
  color:var(--muted);
  font-size:14px;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.progress{
  margin-top:20px;
}

.progress input{
  width:100%;
  accent-color:var(--accent);
  cursor:pointer;
}

.time{
  display:flex;
  justify-content:space-between;

  color:var(--muted);
  font-size:11px;

  margin-top:5px;
}

.controls{
  display:flex;
  align-items:center;
  justify-content:center;

  gap:22px;

  margin-top:16px;
}

.control{
  width:44px;
  height:44px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.1);

  font-size:18px;
}

.control.main{
  width:62px;
  height:62px;

  background:var(--accent);
  color:#17131f;

  font-size:23px;

  box-shadow:
    0 10px 35px rgba(169,140,255,.3);
}

.volume{
  display:flex;
  align-items:center;
  gap:10px;

  margin-top:15px;

  color:var(--muted);
}

.volume input{
  width:100%;
  accent-color:var(--accent);
}

/* ---------------- LIBRARY ---------------- */

.library-header{
  display:flex;
  justify-content:space-between;
  align-items:end;

  margin:20px 2px 12px;
}

.library-title{
  font-size:18px;
  font-weight:700;
}

.library-count{
  color:var(--muted);
  font-size:12px;
}

.list{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.track{
  display:flex;
  align-items:center;
  gap:13px;

  padding:12px;

  border-radius:18px;

  background:var(--glass);
  border:1px solid var(--border);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  cursor:pointer;

  transition:
    background .2s,
    transform .2s;
}

.track:hover{
  background:var(--glass-strong);
}

.track.active{
  border-color:rgba(169,140,255,.6);
  background:rgba(169,140,255,.13);
}

.track-number{
  width:27px;
  text-align:center;

  color:var(--muted);
  font-size:12px;
}

.track-icon{
  width:44px;
  height:44px;

  border-radius:13px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(255,255,255,.08);

  font-size:18px;
}

.track-details{
  flex:1;
  min-width:0;
}

.track-name{
  font-size:14px;
  font-weight:600;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.track-sub{
  margin-top:3px;

  color:var(--muted);
  font-size:11px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.track-more{
  color:var(--muted);
  font-size:18px;
}

/* ---------------- EMPTY / ERROR ---------------- */

.empty{
  padding:30px 20px;

  border-radius:20px;

  text-align:center;

  color:var(--muted);

  background:var(--glass);
  border:1px solid var(--border);

  line-height:1.6;
}

.error{
  color:#ffb5c2;
}

.setup{
  margin-top:40px;
  padding:25px;

  border-radius:22px;

  background:var(--glass);
  border:1px solid var(--border);

  backdrop-filter:blur(20px);
}

.setup h2{
  margin-bottom:10px;
}

.setup p{
  color:var(--muted);
  line-height:1.6;
}

/* ---------------- RESPONSIVE ---------------- */

@media(max-width:600px){

  .app{
    padding-left:14px;
    padding-right:14px;
  }

  .player{
    padding:15px;
    border-radius:24px;
  }

  .visual{
    border-radius:18px;
  }

  .track-title{
    font-size:20px;
  }

  .controls{
    gap:16px;
  }

}

@media(min-width:700px){

  .visual{
    max-width:520px;
    margin:auto;
  }

  .track-info{
    max-width:520px;
    margin-left:auto;
    margin-right:auto;
  }

  .progress,
  .controls,
  .volume{
    max-width:520px;
    margin-left:auto;
    margin-right:auto;
  }

}
</style>
</head>

<body>

<div class="app">

  <header class="header">

    <div class="logo">

      <div class="logo-icon">
        ♪
      </div>

      <div>
        <div class="logo-text">
          Glass Player
        </div>

        <div class="repo-name" id="repoName">
          Loading library...
        </div>
      </div>

    </div>

    <button
      class="refresh"
      id="refreshBtn"
      title="Refresh library"
      aria-label="Refresh library"
    >
      ↻
    </button>

  </header>


  <div class="search">

    <span class="search-icon">
      ⌕
    </span>

    <input
      id="search"
      type="search"
      placeholder="Search music..."
      autocomplete="off"
    >

  </div>


  <main>

    <section class="player">

      <div class="visual" id="visual">

        <div
          class="visual-icon"
          id="visualIcon"
        >
          ♪
        </div>

        <video
          id="video"
          controls
          playsinline
        ></video>

      </div>


      <div class="track-info">

        <div
          class="track-title"
          id="trackTitle"
        >
          Nothing playing
        </div>

        <div
          class="track-artist"
          id="trackArtist"
        >
          Select a track
        </div>

      </div>


      <div class="progress">

        <input
          id="progress"
          type="range"
          min="0"
          max="100"
          value="0"
          step="0.1"
        >

        <div class="time">

          <span id="currentTime">
            0:00
          </span>

          <span id="duration">
            0:00
          </span>

        </div>

      </div>


      <div class="controls">

        <button
          class="control"
          id="prevBtn"
          aria-label="Previous"
        >
          ⏮
        </button>

        <button
          class="control"
          id="backBtn"
          aria-label="Back 10 seconds"
        >
          ↶
        </button>

        <button
          class="control main"
          id="playBtn"
          aria-label="Play"
        >
          ▶
        </button>

        <button
          class="control"
          id="forwardBtn"
          aria-label="Forward 10 seconds"
        >
          ↷
        </button>

        <button
          class="control"
          id="nextBtn"
          aria-label="Next"
        >
          ⏭
        </button>

      </div>


      <div class="volume">

        <span>
          🔊
        </span>

        <input
          id="volume"
          type="range"
          min="0"
          max="1"
          value=".8"
          step=".01"
        >

      </div>

    </section>


    <section>

      <div class="library-header">

        <div class="library-title">
          Library
        </div>

        <div
          class="library-count"
          id="libraryCount"
        >
          0 tracks
        </div>

      </div>

      <div
        class="list"
        id="homeList"
      >
        <div class="empty">
          Loading music...
        </div>
      </div>

    </section>

  </main>

</div>


<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

const CONFIG = {

  // GitHub username
  OWNER: "realliamdunbar",

  // Repository name
  REPO: "realdunbar",

  // Your repository's branch
  BRANCH: "main",

  // IMPORTANT:
  // Your music folder is directly in the repository root.
  //
  // repo/
  // ├── index.html
  // └── music/
  //
  FOLDER: "music",

  // Leave empty for a public repository.
  TOKEN: ""

};


/* =========================================================
   STATE
   ========================================================= */

let tracks = [];
let filteredTracks = [];

let currentIndex = -1;

let audio = new Audio();

audio.preload = "metadata";
audio.volume = .8;


/* =========================================================
   ELEMENTS
   ========================================================= */

const $ = selector =>
  document.querySelector(selector);

const repoName =
  $("#repoName");

const homeList =
  $("#homeList");

const libraryCount =
  $("#libraryCount");

const search =
  $("#search");

const refreshBtn =
  $("#refreshBtn");

const playBtn =
  $("#playBtn");

const prevBtn =
  $("#prevBtn");

const nextBtn =
  $("#nextBtn");

const backBtn =
  $("#backBtn");

const forwardBtn =
  $("#forwardBtn");

const progress =
  $("#progress");

const volume =
  $("#volume");

const currentTime =
  $("#currentTime");

const duration =
  $("#duration");

const trackTitle =
  $("#trackTitle");

const trackArtist =
  $("#trackArtist");

const visual =
  $("#visual");

const visualIcon =
  $("#visualIcon");

const video =
  $("#video");


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function esc(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   PRETTY FILE NAME
   ========================================================= */

function pretty(file){

  return file
    .replace(/\.[^/.]+$/,"")
    .replace(/[_-]+/g," ")
    .replace(/\s+/g," ")
    .trim();

}


/* =========================================================
   REPOSITORY
   ========================================================= */

function detectRepo(){

  return {
    o: CONFIG.OWNER,
    r: CONFIG.REPO
  };

}


/* =========================================================
   MEDIA URL
   ========================================================= */

function mediaUrl(owner, repo, path){

  const encoded =
    path
      .split("/")
      .map(encodeURIComponent)
      .join("/");


  /*
   * Your custom domain:
   *
   * https://iankreidehuter.space/
   *
   * Repository:
   *
   * index.html
   * music/Hh.mp3
   *
   * Therefore:
   *
   * /music/Hh.mp3
   */

  if(
    location.hostname === "iankreidehuter.space" ||
    location.hostname === "www.iankreidehuter.space"
  ){

    return "/" + encoded;

  }


  /*
   * GitHub Pages fallback
   */

  if(
    location.hostname.endsWith(".github.io")
  ){

    return "/" + encoded;

  }


  /*
   * Raw GitHub fallback
   */

  return (
    "https://raw.githubusercontent.com/" +
    encodeURIComponent(owner) +
    "/" +
    encodeURIComponent(repo) +
    "/" +
    encodeURIComponent(CONFIG.BRANCH || "main") +
    "/" +
    encoded
  );

}


/* =========================================================
   CONVERT GITHUB PATH TO TRACK
   ========================================================= */

function toTrack(path, owner, repo){

  const parts =
    path.split("/");

  const file =
    parts.pop();

  const extension =
    file
      .split(".")
      .pop()
      .toLowerCase();


  let title =
    pretty(file);

  let artist = "";


  /*
   * Supports:
   *
   * Artist - Song.mp3
   */

  const match =
    title.match(/^(.+?)\s+-\s+(.+)$/);


  if(match){

    artist =
      match[1];

    title =
      match[2];

  }


  const folder =
    parts.length
      ? parts[parts.length - 1]
      : "Music";


  return {

    id:path,

    path:path,

    title:title,

    artist:artist || folder,

    folder:folder,

    video:extension === "mp4",

    url:mediaUrl(
      owner,
      repo,
      path
    )

  };

}


/* =========================================================
   CACHE
   ========================================================= */

const CACHE_TIME =
  30 * 1000;


/* =========================================================
   LOAD LIBRARY
   ========================================================= */

async function load(force = false){

  const {
    o,
    r
  } = detectRepo();


  if(!o || !r){

    showError(
      "GitHub repository is not configured."
    );

    return;

  }


  repoName.textContent =
    `${o}/${r}`;


  const folder =
    CONFIG.FOLDER
      .replace(/^\/|\/$/g,"");


  const cacheKey =
    `glass_player_${o}_${r}_${folder}`;


  /*
   * Use session cache unless
   * refresh was requested.
   */

  if(!force){

    try{

      const cached =
        JSON.parse(
          sessionStorage.getItem(cacheKey) || "null"
        );


      if(
        cached &&
        Array.isArray(cached.v) &&
        Date.now() - cached.t < CACHE_TIME
      ){

        tracks =
          cached.v;

        ready();

        return;

      }

    }catch(error){

      console.warn(
        "Cache read failed:",
        error
      );

    }

  }


  setLoading(true);


  try{

    const headers = {

      Accept:
        "application/vnd.github+json"

    };


    if(CONFIG.TOKEN){

      headers.Authorization =
        "Bearer " + CONFIG.TOKEN;

    }


    /*
     * IMPORTANT:
     *
     * We scan the entire repository,
     * then only keep files inside /music.
     */

    const apiUrl =
      `https://api.github.com/repos/${encodeURIComponent(o)}/${encodeURIComponent(r)}/git/trees/${encodeURIComponent(CONFIG.BRANCH || "main")}?recursive=1`;


    const response =
      await fetch(
        apiUrl,
        {
          headers,
          cache:"no-store"
        }
      );


    if(response.status === 403){

      throw new Error(
        "GitHub API rate limit reached. Please wait a little and try again."
      );

    }


    if(response.status === 404){

      throw new Error(
        `Repository ${o}/${r} or branch "${CONFIG.BRANCH}" was not found.`
      );

    }


    if(!response.ok){

      throw new Error(
        `GitHub returned HTTP ${response.status}.`
      );

    }


    const data =
      await response.json();


    if(!Array.isArray(data.tree)){

      throw new Error(
        "GitHub returned an invalid repository tree."
      );

    }


    if(data.truncated){

      console.warn(
        "GitHub returned a truncated tree."
      );

    }


    /*
     * Because FOLDER = music,
     * the prefix becomes:
     *
     * music/
     */

    const prefix =
      folder
        ? folder + "/"
        : "";


    tracks =
      data.tree

        .filter(file => {

          if(file.type !== "blob"){
            return false;
          }


          if(!/\.(mp3|mp4)$/i.test(file.path)){
            return false;
          }


          return file.path.startsWith(prefix);

        })

        .map(file =>
          toTrack(
            file.path,
            o,
            r
          )
        )

        .sort(
          (a,b) =>
            a.path.localeCompare(
              b.path,
              undefined,
              {
                numeric:true
              }
            )
        );


    /*
     * Save short cache.
     */

    try{

      sessionStorage.setItem(
        cacheKey,
        JSON.stringify({
          t:Date.now(),
          v:tracks
        })
      );

    }catch(error){

      console.warn(
        "Cache write failed:",
        error
      );

    }


    ready();

  }catch(error){

    console.error(error);

    showError(
      error.message
    );

  }finally{

    setLoading(false);

  }

}


/* =========================================================
   READY
   ========================================================= */

function ready(){

  filteredTracks =
    [...tracks];

  libraryCount.textContent =
    `${tracks.length} ${tracks.length === 1 ? "track" : "tracks"}`;

  renderTracks();

  setLoading(false);

}


/* =========================================================
   LOADING STATE
   ========================================================= */

function setLoading(state){

  refreshBtn.classList.toggle(
    "loading",
    state
  );

}


/* =========================================================
   ERROR
   ========================================================= */

function showError(message){

  libraryCount.textContent =
    "Error";

  homeList.innerHTML = `

    <div class="empty error">

      <strong>
        Couldn't load music
      </strong>

      <br><br>

      ${esc(message)}

      <br><br>

      Check your GitHub repository,
      branch, and <b>music/</b> folder.

    </div>

  `;

}


/* =========================================================
   RENDER TRACKS
   ========================================================= */

function renderTracks(){

  if(!filteredTracks.length){

    homeList.innerHTML = `

      <div class="empty">

        No MP3 or MP4 files found in
        <b>music/</b>.

        <br><br>

        Upload something like:

        <br>

        <code>music/Hh.mp3</code>

      </div>

    `;

    return;

  }


  homeList.innerHTML =
    filteredTracks
      .map((track,index) => {

        const realIndex =
          tracks.indexOf(track);


        return `

          <div
            class="track ${realIndex === currentIndex ? "active" : ""}"
            data-index="${realIndex}"
          >

            <div class="track-number">
              ${String(index + 1).padStart(2,"0")}
            </div>

            <div class="track-icon">
              ${track.video ? "▣" : "♪"}
            </div>

            <div class="track-details">

              <div class="track-name">
                ${esc(track.title)}
              </div>

              <div class="track-sub">
                ${esc(track.artist)}
              </div>

            </div>

            <div class="track-more">
              ${realIndex === currentIndex ? "●" : "›"}
            </div>

          </div>

        `;

      })
      .join("");


  homeList
    .querySelectorAll(".track")
    .forEach(element => {

      element.addEventListener(
        "click",
        () => {

          const index =
            Number(
              element.dataset.index
            );

          playTrack(index);

        }
      );

    });

}


/* =========================================================
   PLAY TRACK
   ========================================================= */

function playTrack(index){

  if(
    index < 0 ||
    index >= tracks.length
  ){
    return;
  }


  const track =
    tracks[index];


  currentIndex =
    index;


  trackTitle.textContent =
    track.title;


  trackArtist.textContent =
    track.artist;


  progress.value =
    0;


  currentTime.textContent =
    "0:00";


  duration.textContent =
    "0:00";


  /*
   * MP4
   */

  if(track.video){

    audio.pause();

    video.style.display =
      "block";

    visualIcon.style.display =
      "none";


    video.src =
      track.url;

    video.volume =
      Number(volume.value);


    video.play()
      .catch(error =>
        console.warn(
          "Video autoplay blocked:",
          error
        )
      );

  }

  /*
   * MP3
   */

  else{

    video.pause();

    video.removeAttribute("src");

    video.load();

    video.style.display =
      "none";

    visualIcon.style.display =
      "block";


    audio.src =
      track.url;

    audio.currentTime =
      0;

    audio.play()
      .catch(error =>
        console.warn(
          "Audio autoplay blocked:",
          error
        )
      );

  }


  renderTracks();

}


/* =========================================================
   PLAY / PAUSE
   ========================================================= */

function togglePlay(){

  if(currentIndex === -1){

    if(tracks.length){

      playTrack(0);

    }

    return;

  }


  const track =
    tracks[currentIndex];


  if(track.video){

    if(video.paused){

      video.play();

    }else{

      video.pause();

    }

  }else{

    if(audio.paused){

      audio.play();

    }else{

      audio.pause();

    }

  }

}


/* =========================================================
   UPDATE PLAY BUTTON
   ========================================================= */

function updatePlayButton(){

  if(currentIndex === -1){

    playBtn.textContent =
      "▶";

    return;

  }


  const track =
    tracks[currentIndex];


  const playing =
    track.video
      ? !video.paused
      : !audio.paused;


  playBtn.textContent =
    playing
      ? "Ⅱ"
      : "▶";

}


/* =========================================================
   NEXT
   ========================================================= */

function nextTrack(){

  if(!tracks.length){
    return;
  }


  let next =
    currentIndex + 1;


  if(next >= tracks.length){

    next = 0;

  }


  playTrack(next);

}


/* =========================================================
   PREVIOUS
   ========================================================= */

function previousTrack(){

  if(!tracks.length){
    return;
  }


  let previous =
    currentIndex - 1;


  if(previous < 0){

    previous =
      tracks.length - 1;

  }


  playTrack(previous);

}


/* =========================================================
   TIME FORMAT
   ========================================================= */

function formatTime(seconds){

  if(!Number.isFinite(seconds)){
    return "0:00";
  }


  const minutes =
    Math.floor(seconds / 60);


  const secs =
    Math.floor(seconds % 60);


  return (
    minutes +
    ":" +
    String(secs).padStart(2,"0")
  );

}


/* =========================================================
   UPDATE PROGRESS
   ========================================================= */

function updateProgress(){

  const track =
    currentIndex >= 0
      ? tracks[currentIndex]
      : null;


  if(!track){
    return;
  }


  const media =
    track.video
      ? video
      : audio;


  if(!Number.isFinite(media.duration)){
    return;
  }


  const percent =
    (media.currentTime / media.duration) * 100;


  progress.value =
    percent || 0;


  currentTime.textContent =
    formatTime(
      media.currentTime
    );


  duration.textContent =
    formatTime(
      media.duration
    );

}


/* =========================================================
   SEEK
   ========================================================= */

function seek(value){

  if(currentIndex === -1){
    return;
  }


  const track =
    tracks[currentIndex];


  const media =
    track.video
      ? video
      : audio;


  if(!Number.isFinite(media.duration)){
    return;
  }


  media.currentTime =
    media.duration *
    (Number(value) / 100);

}


/* =========================================================
   SEARCH
   ========================================================= */

search.addEventListener(
  "input",
  () => {

    const query =
      search.value
        .trim()
        .toLowerCase();


    if(!query){

      filteredTracks =
        [...tracks];

    }else{

      filteredTracks =
        tracks.filter(track =>

          track.title
            .toLowerCase()
            .includes(query)

          ||

          track.artist
            .toLowerCase()
            .includes(query)

          ||

          track.path
            .toLowerCase()
            .includes(query)

        );

    }


    renderTracks();

  }
);


/* =========================================================
   CONTROLS
   ========================================================= */

playBtn.addEventListener(
  "click",
  togglePlay
);

prevBtn.addEventListener(
  "click",
  previousTrack
);

nextBtn.addEventListener(
  "click",
  nextTrack
);


backBtn.addEventListener(
  "click",
  () => {

    if(currentIndex === -1){
      return;
    }


    const track =
      tracks[currentIndex];


    const media =
      track.video
        ? video
        : audio;


    media.currentTime =
      Math.max(
        0,
        media.currentTime - 10
      );

  }
);


forwardBtn.addEventListener(
  "click",
  () => {

    if(currentIndex === -1){
      return;
    }


    const track =
      tracks[currentIndex];


    const media =
      track.video
        ? video
        : audio;


    media.currentTime =
      Math.min(
        media.duration || Infinity,
        media.currentTime + 10
      );

  }
);


/* =========================================================
   PROGRESS CONTROL
   ========================================================= */

progress.addEventListener(
  "input",
  () => {

    seek(
      progress.value
    );

  }
);


/* =========================================================
   VOLUME
   ========================================================= */

volume.addEventListener(
  "input",
  () => {

    const value =
      Number(volume.value);


    audio.volume =
      value;

    video.volume =
      value;

  }
);


/* =========================================================
   MEDIA EVENTS
   ========================================================= */

audio.addEventListener(
  "timeupdate",
  updateProgress
);

audio.addEventListener(
  "loadedmetadata",
  updateProgress
);

video.addEventListener(
  "timeupdate",
  updateProgress
);

video.addEventListener(
  "loadedmetadata",
  updateProgress
);


audio.addEventListener(
  "play",
  updatePlayButton
);

audio.addEventListener(
  "pause",
  updatePlayButton
);

video.addEventListener(
  "play",
  updatePlayButton
);

video.addEventListener(
  "pause",
  updatePlayButton
);


/* =========================================================
   AUTO NEXT
   ========================================================= */

audio.addEventListener(
  "ended",
  nextTrack
);

video.addEventListener(
  "ended",
  nextTrack
);


/* =========================================================
   REFRESH
   ========================================================= */

refreshBtn.addEventListener(
  "click",
  async () => {

    const {
      o,
      r
    } = detectRepo();


    const folder =
      CONFIG.FOLDER
        .replace(/^\/|\/$/g,"");


    const cacheKey =
      `glass_player_${o}_${r}_${folder}`;


    /*
     * Remove old cached library.
     */

    try{

      sessionStorage.removeItem(
        cacheKey
      );

    }catch(error){

      console.warn(error);

    }


    await load(true);

  }
);


/* =========================================================
   KEYBOARD SHORTCUTS
   ========================================================= */

document.addEventListener(
  "keydown",
  event => {

    /*
     * Don't hijack typing.
     */

    if(
      event.target.tagName === "INPUT"
    ){
      return;
    }


    switch(event.code){

      case "Space":

        event.preventDefault();
        togglePlay();

        break;


      case "ArrowRight":

        if(currentIndex !== -1){

          const track =
            tracks[currentIndex];

          const media =
            track.video
              ? video
              : audio;


          media.currentTime += 5;

        }

        break;


      case "ArrowLeft":

        if(currentIndex !== -1){

          const track =
            tracks[currentIndex];

          const media =
            track.video
              ? video
              : audio;


          media.currentTime -= 5;

        }

        break;


      case "ArrowUp":

        event.preventDefault();

        volume.value =
          Math.min(
            1,
            Number(volume.value) + .05
          );

        audio.volume =
          Number(volume.value);

        video.volume =
          Number(volume.value);

        break;


      case "ArrowDown":

        event.preventDefault();

        volume.value =
          Math.max(
            0,
            Number(volume.value) - .05
          );

        audio.volume =
          Number(volume.value);

        video.volume =
          Number(volume.value);

        break;

    }

  }
);


/* =========================================================
   START
   ========================================================= */

load();

</script>

</body>
</html>
